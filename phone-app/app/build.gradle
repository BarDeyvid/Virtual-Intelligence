plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alyssa.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.alyssa.app"
        minSdk 26            // Android 8; o Poco X6 Pro é Android 16, folga total
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            // Debug-signable pra "Run" no Studio gerar APK sem configurar keystore.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
